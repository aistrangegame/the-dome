<!doctype html>
<html lang="en" data-season="summer">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Timeline · Catskill Mountain Domes</title>
<link rel="stylesheet" href="assets/css/dome.css">
</head>
<body data-root="./" data-page="timeline.html" data-solid="1">
<main style="padding-top:72px">
<section class="band" style="padding-bottom:20px"><div class="reading rise"><span class="eyebrow">The living timeline</span><h1>2023 to now.</h1>
  <p class="lede">Every voice in its season, every change with a name on it. The timeline grows with each stay.</p></div></section>
<section class="band" style="padding-top:20px"><div class="reading"><div class="tl" id="tl"></div></div></section>
</main>
<script>
window.page = function (Dome) {
  const { D, esc, slotHTML } = Dome;
  document.getElementById("tl").innerHTML = D.timeline.map((t) => `<div class="tl-item rise ${t.kind === "mark" ? "mark" : ""}">
    <div class="tl-when">${esc(t.when)}${t.kind === "idea" ? " · an idea" : ""}</div><h3>${esc(t.title)}</h3>
    ${t.review ? `<blockquote class="voice" style="font-size:1.1rem">${esc(t.review[2])}</blockquote><span class="voice-by">${esc(t.review[1])} · guest #${t.review[0]}</span>` : ""}
    ${t.slot ? slotHTML(t.slot) : ""}</div>`).join("");
};
</script>
<script src="assets/js/reviews.js"></script>
<script src="assets/js/dome-data.js"></script>
<script src="assets/js/dome.js"></script>
</body>
</html>
